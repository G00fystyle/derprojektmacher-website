<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 430 110" role="img" aria-labelledby="title desc">
  <title id="title">DER PROJEKTMACHER</title>
  <desc id="desc">Logo mit schwarzem Quadrat, orangem Haken und Wortmarke DER PROJEKTMACHER</desc>
  <rect x="8" y="18" width="72" height="72" fill="none" stroke="#111827" stroke-width="6"/>
  <path d="M25 54 L42 70 L77 31" fill="none" stroke="#f45a14" stroke-width="9" stroke-linecap="square" stroke-linejoin="miter"/>
  <text x="99" y="47" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="800" fill="#111827">DER</text>
  <text x="99" y="77" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="800" fill="#111827">PROJEKTMACHER</text>
  <text x="100" y="98" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#f45a14">Ich kümmere mich darum.</text>
